<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Minimales Cocktail-Formular</title>
  <!-- Verknüpfung mit der CSS-Datei -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="main-container">
    <form id="cocktailForm" onsubmit="return false;">

      <!-- ==================== SCHRITT 1 ==================== -->
      <div id="step1" class="step">
        <h2>Schritt 1: Suchart wählen</h2>

        <!-- Dropdown bestimmt, welches Input-Feld gezeigt wird -->
        <label for="searchType">Suchen nach:</label>
        <select id="searchType">
          <option value="name">Cocktailname</option>
          <option value="ingredient">Hauptzutat</option>
        </select>

        <!-- Eingabefeld A: Name -->
        <div id="groupName">
          <label for="inputName">Name:</label>
          <input 
            type="text" 
            id="inputName" 
            placeholder="z. B. French 75"
            aria-describedby="feedbackText nameHint"
            aria-invalid="false"
          >
          <small id="nameHint" class="hint-text">Buchstaben und Zahlen sind gültig (2–30 Zeichen).</small>
        </div>

        <!-- Eingabefeld B: Zutat (startet ausgeblendet) -->
        <div id="groupIngredient" class="hidden">
          <label for="inputIngredient">Zutat:</label>
          <input 
            type="text" 
            id="inputIngredient" 
            placeholder="z. B. Gin"
            aria-describedby="feedbackText ingredientHint"
            aria-invalid="false"
          >
          <small id="ingredientHint" class="hint-text">Buchstaben und Zahlen sind gültig (2–30 Zeichen).</small>
        </div>

        <!-- Text für barrierefreies Validierungs-Feedback -->
        <p id="feedbackText" role="alert" aria-live="polite"></p>

        <button type="button" id="btnStep1">Weiter</button>
      </div>

      <!-- ==================== SCHRITT 2 ==================== -->
      <div id="step2" class="step hidden">
        <h2>Schritt 2: Cocktail auswählen</h2>

        <!-- Dropdown für die API-Ergebnisse -->
        <label for="resultsSelect">Ergebnisliste:</label>
        <select id="resultsSelect">
          <option value="">-- Bitte wählen --</option>
        </select>

        <div class="button-group">
          <button type="button" id="btnBackTo1" class="btn-secondary">Zurück</button>
          <button type="button" id="btnStep2">Rezept anzeigen</button>
        </div>
      </div>

      <!-- ==================== SCHRITT 3 ==================== -->
      <div id="step3" class="step hidden">
        <h2>Schritt 3: Rezept</h2>
        
        <!-- Hier fügt JS das fertige Ergebnis ein -->
        <div id="recipeResult"></div>

        <button type="button" id="btnBackTo2" class="btn-secondary">Zurück</button>
      </div>

    </form>
  </main>

  <!-- Verknüpfung mit der JS-Datei (am Ende des body geladen) -->
  <script src="script.js"></script>
</body>
</html>
