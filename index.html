<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Minimales Cocktail-Formular</title>
  <!-- Verknüpfung mit der CSS-Datei -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form id="cocktailForm" onsubmit="return false;">

    <!-- ==================== SCHRITT 1 ==================== -->
    <div id="step1" class="step">
      <h2>Schritt 1: Suchart wählen</h2>

      <!-- Dropdown bestimmt, welches Input-Feld gezeigt wird -->
      <label>Suchen nach:</label>
      <select id="searchType">
        <option value="name">Cocktailname</option>
        <option value="ingredient">Hauptzutat</option>
      </select>

      <!-- Eingabefeld A: Name -->
      <div id="groupName">
        <label>Name:</label>
        <input type="text" id="inputName" placeholder="z. B. Margarita">
      </div>

      <!-- Eingabefeld B: Zutat (startet ausgeblendet) -->
      <div id="groupIngredient" class="hidden">
        <label>Zutat:</label>
        <input type="text" id="inputIngredient" placeholder="z. B. Gin">
      </div>

      <!-- Text für Validierungs-Feedback -->
      <p id="feedbackText"></p>

      <button type="button" id="btnStep1">Weiter</button>
    </div>

    <!-- ==================== SCHRITT 2 ==================== -->
    <div id="step2" class="step hidden">
      <h2>Schritt 2: Cocktail auswählen</h2>

      <!-- Dropdown für die API-Ergebnisse -->
      <select id="resultsSelect">
        <option value="">-- Bitte wählen --</option>
      </select>

      <button type="button" id="btnBackTo1">Zurück</button>
      <button type="button" id="btnStep2">Rezept anzeigen</button>
    </div>

    <!-- ==================== SCHRITT 3 ==================== -->
    <div id="step3" class="step hidden">
      <h2>Schritt 3: Rezept</h2>
      
      <!-- Hier fügt JS das fertige Ergebnis ein -->
      <div id="recipeResult"></div>

      <button type="button" id="btnBackTo2">Zurück</button>
    </div>

  </form>

  <!-- Verknüpfung mit der JS-Datei (am Ende des body geladen) -->
  <script src="script.js"></script>
</body>
</html>
